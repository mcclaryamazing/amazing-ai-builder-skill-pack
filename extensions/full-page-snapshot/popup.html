<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Full Page Snapshot</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <h1>Full Page Snapshot</h1>
        <span class="format-pill">PNG</span>
      </header>

      <button id="captureButton" class="capture-button" type="button">
        <span aria-hidden="true" class="capture-icon"></span>
        <span>Capture Full Page</span>
      </button>

      <label class="mobile-option">
        <input id="includeMobile" type="checkbox">
        <span>Also capture mobile<small>Saves a second PNG in a phone layout.</small></span>
      </label>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
